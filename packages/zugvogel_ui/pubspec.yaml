name: zugvogel_ui
description: >-
  Shared Flutter widgets: state views, inputs, actions, chips, headers, date
  fields, photos, map layers, charts, KPI cards, layout scaffolds and the
  bundled font set. Carries no strings, no colours and no configuration of its
  own — all three arrive injected.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

# Part of the Zugvogel pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  crop_image: ^1.0.17
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ^3.3.2
  http: ^1.3.0
  image: ^4.9.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  meta: ^1.16.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  vector_map_tiles: ^9.0.0-beta.11
  zugvogel_core:
    path: ../zugvogel_core
  zugvogel_data:
    path: ../zugvogel_data
  zugvogel_pb_client:
    path: ../zugvogel_pb_client

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  # Only the tests reach for it, to build the ClientException a
  # RepositoryException is translated from.
  pocketbase: ^0.24.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  # The bundled Roboto + Noto Sans Symbols/Symbols 2/Color Emoji faces are
  # declared here by eiermann-d2a.13, together with the test that pins both
  # this block and fontFamilyFallback. Web has no system fonts: an uncovered
  # codepoint makes the engine fetch a per-glyph Noto slice, the CSP blocks it,
  # and it retries on every layout of that text.
