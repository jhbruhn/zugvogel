name: zugvogel_ui
description: >-
  Shared Flutter widgets: state views, inputs, actions, chips, headers, date
  fields, photos, map layers, charts, KPI cards, layout scaffolds and the
  bundled font set. Carries no strings, no colours and no configuration of its
  own — all three arrive injected.
version: 0.2.0
publish_to: none
repository: https://github.com/jhbruhn/zugvogel
issue_tracker: https://github.com/jhbruhn/eiermann/issues
environment:
  sdk: ^3.12.0
  flutter: ^3.44.0
resolution: workspace
dependencies:
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  crop_image: ^1.0.17
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ^3.3.2
  http: ^1.3.0
  image: ^4.9.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  meta: ^1.16.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  vector_map_tiles: ^9.0.0-beta.11
  zugvogel_core:
    path: ../zugvogel_core
  zugvogel_data:
    path: ../zugvogel_data
  zugvogel_pb_client:
    path: ../zugvogel_pb_client
dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  pocketbase: ^0.24.0
  very_good_analysis: ^10.3.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
