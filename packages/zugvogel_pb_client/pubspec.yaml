name: zugvogel_pb_client
description: >-
  The PocketBase connection: client provider, auth-token storage, server-URL
  storage, reachability probe, /info reader, version compatibility, session
  refresh, realtime subscriptions and connectivity. Flutter package (secure
  storage and connectivity are platform plugins).
version: 0.2.0
publish_to: none
repository: https://github.com/jhbruhn/zugvogel
issue_tracker: https://github.com/jhbruhn/eiermann/issues
environment:
  sdk: ^3.12.0
  flutter: ^3.44.0
resolution: workspace
dependencies:
  connectivity_plus: ^7.2.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.0.0
  http: ^1.3.0
  meta: ^1.16.0
  package_info_plus: ^10.2.0
  pocketbase: ^0.24.0
  shared_preferences: ^2.5.5
  zugvogel_core:
    path: ../zugvogel_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0
