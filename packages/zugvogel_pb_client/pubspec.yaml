name: zugvogel_pb_client
description: >-
  The PocketBase connection: client provider, auth-token storage, server-URL
  storage, reachability probe, /info reader, version compatibility, session
  refresh, realtime subscriptions and connectivity. Flutter package (secure
  storage and connectivity are platform plugins).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

# Part of the Zugvogel pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  connectivity_plus: ^7.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.0.0
  http: ^1.3.0
  pocketbase: ^0.24.0
  riverpod_annotation: ^4.0.3
  zugvogel_core:
    path: ../zugvogel_core
  zugvogel_data:
    path: ../zugvogel_data

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0
