name: zugvogel_data
description: >-
  Generic PocketBase repository layer: typed collection access, PbFilter, keyset
  paging, multipart create/update, file URLs, error translation and the
  idempotency helper. Pure Dart; no Flutter dependency.
version: 0.2.0
publish_to: none
repository: https://github.com/jhbruhn/zugvogel
issue_tracker: https://github.com/jhbruhn/eiermann/issues
environment:
  sdk: ^3.12.0
resolution: workspace
dependencies:
  http: ^1.3.0
  meta: ^1.16.0
  pocketbase: ^0.24.0
  zugvogel_core:
    path: ../zugvogel_core
dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.25.0
  very_good_analysis: ^10.3.0
