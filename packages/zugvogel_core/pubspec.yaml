name: zugvogel_core
description: >-
  Domain-free primitives shared by the Zugvogel apps: GeoPoint, PocketBase
  field converters, the wire-value enum pattern, Result, ErrorMessage and the
  logger. Pure Dart; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Part of the Zugvogel pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  meta: ^1.16.0
  pocketbase: ^0.24.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.3.0
