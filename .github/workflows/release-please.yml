name: Release Please

# release-please watches conventional-commit history on main and maintains a
# standing "release PR" with the next version bump + CHANGELOG. Merging that PR
# tags vX.Y.Z and creates a GitHub Release.
#
# ── Nothing is released yet, and that is fine ──────────────────────────────
# Both apps pin a COMMIT HASH (see README.md), so the standing PR this opens is
# a running summary of what a release WOULD contain rather than something to
# merge. Leaving it open costs nothing and creates nothing: the tag and the
# GitHub Release only exist once somebody merges it.
#
# Which is also the caution — merging it creates a tag, and a tag that exists is
# a tag somebody can pin by accident, reintroducing the moved-ref problem
# hash-pinning avoids. Merge it when releases genuinely start, not to tidy the
# PR list.
#
# There is deliberately no build or publish job here either. Zugvogel is not
# published to pub.dev and ships no app. The one image this repo does build
# (zugvogel-pb-base, eiermann-d2a.19) adds its own job when it lands.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # No Docker, no build step — just the release-please API call.
    runs-on: ubuntu-slim
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
