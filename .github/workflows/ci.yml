name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay in lockstep with both consuming apps (federfall, eiermann): this
  # library is compiled by their toolchain, not its own, so a version they do
  # not have is a break they discover and not CI.
  FLUTTER_VERSION: "3.44.3"

jobs:
  dart:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Resolves the whole pub workspace from the repo root.
      - name: Install dependencies
        run: flutter pub get

      # Format the hand-written source before any generated files exist, so the
      # check never trips over generator output.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # No codegen step, deliberately. Both apps consume this library as a git
      # dependency and build_runner cannot run inside a fetched dependency, so
      # nothing here generates code — riverpod providers are hand-written and
      # GeoPoint is not freezed. `flutter analyze` from the repo root analyzes
      # the whole workspace at once.
      - name: Analyze
        run: flutter analyze

      # Pure-Dart members run under `dart test`; the two Flutter members need
      # `flutter test`. There is no app here to aggregate coverage into, so
      # each package is run on its own.
      - name: Test zugvogel_core
        run: dart test
        working-directory: packages/zugvogel_core

      - name: Test zugvogel_data
        run: dart test
        working-directory: packages/zugvogel_data

      - name: Test zugvogel_pb_client
        run: flutter test
        working-directory: packages/zugvogel_pb_client

      - name: Test zugvogel_ui
        run: flutter test
        working-directory: packages/zugvogel_ui

  hooks:
    name: hooks · unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pure functions in pb_hooks/zv_*.js — value normalisation, the audit
      # diff and its redaction, caller-local time, the geocode result shape.
      # Anything that touches a collection or a schema needs a LIVE PocketBase
      # and belongs to the harness (eiermann-d2a.18), not here.
      - name: Run hook unit tests
        run: node --test
        working-directory: backend/pocketbase/tests/unit

      # The shared Python harness both apps' rule suites are built on. A harness
      # that miscounts, or a sweep helper that matches the wrong thing, makes
      # every suite built on it lie — and neither needs a PocketBase to check.
      - name: Test the rule-suite harness
        run: PYTHONPATH=. python3 test_zv_harness.py
        working-directory: backend/pocketbase/tests
